<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSLIM 문서 모음</title>
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root{
      --bg:#edf3fb;
      --paper:#ffffff;
      --line:#dde7f2;
      --ink:#1d2b42;
      --sub:#5d6b80;
      --blue:#295ca8;
      --green:#2d8b78;
      --shadow:0 24px 60px rgba(19,38,64,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      background:
        radial-gradient(circle at top right, rgba(45,139,120,.14), transparent 28%),
        linear-gradient(135deg, #f4f8fd 0%, var(--bg) 100%);
      color:var(--ink);
      font-family:'Paperlogy','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    }
    .shell{
      width:min(920px,100%);
      background:rgba(255,255,255,.84);
      backdrop-filter:blur(10px);
      border:1px solid rgba(221,231,242,.95);
      border-radius:32px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hero{
      padding:48px 52px 28px;
      background:linear-gradient(135deg, rgba(255,255,255,.96) 0%, rgba(239,246,255,.92) 58%, rgba(236,249,246,.88) 100%);
      border-bottom:1px solid var(--line);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(41,92,168,.16);
      color:var(--blue);
      background:rgba(255,255,255,.82);
      font-size:14px;
      font-weight:700;
    }
    h1{
      margin:18px 0 10px;
      font-size:42px;
      line-height:1.1;
      letter-spacing:0;
    }
    .intro{
      margin:0;
      max-width:620px;
      color:var(--sub);
      font-size:18px;
      line-height:1.7;
    }
    .content{
      padding:28px 52px 52px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:24px;
      padding:24px;
      box-shadow:0 16px 36px rgba(34,58,96,.06);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover{
      transform:translateY(-3px);
      border-color:rgba(41,92,168,.32);
      box-shadow:0 22px 42px rgba(34,58,96,.12);
    }
    .label{
      display:inline-flex;
      align-items:center;
      padding:6px 11px;
      border-radius:999px;
      background:#eef4ff;
      color:var(--blue);
      font-size:12px;
      font-weight:700;
    }
    .card h2{
      margin:16px 0 10px;
      font-size:28px;
      line-height:1.2;
    }
    .card p{
      margin:0;
      color:var(--sub);
      line-height:1.7;
    }
    .footer{
      margin-top:22px;
      color:#728097;
      font-size:13px;
    }
    @media (max-width:780px){
      body{padding:18px}
      .hero{padding:34px 24px 22px}
      .content{padding:22px 24px 28px}
      h1{font-size:34px}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">CSLIM 문서 모음</div>
      <h1>이력서 · 포트폴리오</h1>
      <p class="intro">개발자 임채석의 이력과 포트폴리오를 확인할수 있는 문서입니다.<br>아래 링크에서 확인 가능합니다.</p>
    </section>
    <section class="content">
      <div class="grid">
        <a class="card" href="CSLIM-SELF.html">
          <span class="label">이력서 및 자기소개서</span>
          <h2>이력서 및 자기소개서</h2>
          <p>경력, 핵심 역량, 자기소개서, 추가 활동을 포함한 이력서 입니다.</p>
        </a>
        <a class="card" href="CSLIM-PORTFOLIO.html">
          <span class="label">주요 포트폴리오 상세</span>
          <h2>주요 포트폴리오 상세</h2>
          <p>ADAS, 교육용 플랫폼, 금융공학 시스템, LLM SaaS 프로젝트를 정리한 포트폴리오입니다.</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
